name: 功能建议
description: 提议新的翻译体验或兼容能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望效果
      description: 描述你希望软件如何表现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 项目范围
      options:
        - label: 我确认该建议与本仓库的漫画图片翻译版本有关。
          required: true
